name: Data

# No path filters: this is a required check, and a filtered-out run never reports, blocking the PR.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check generated data
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.23'
          enable-cache: false

      - name: Check generated data matches its sources
        run: uv run --locked scripts/build_data.py --check

      - name: Lint data script
        run: uvx ruff@0.16.10 check scripts

      - name: Check data script formatting
        run: uvx ruff@0.16.10 format --check scripts
