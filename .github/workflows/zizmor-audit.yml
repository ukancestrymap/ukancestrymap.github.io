name: Audit workflows with zizmor

on:
  push:
    branches: [main]
    paths:
      - '.github/**'
  # Unfiltered on PRs: this is a required check, and a filtered-out run never reports.
  pull_request:
  schedule:
    - cron: '15 3 * * 1' # Every Monday at 03:15 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # upload results to code scanning
      actions: read # the code scanning upload reads workflow run details

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Inputs are .github rather than .github/workflows so dependabot.yml is audited too.
      # No upload on PRs: Dependabot's PRs get a read-only token. The next step gates PRs.
      - name: Run zizmor (upload to code scanning)
        if: github.event_name != 'pull_request'
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          inputs: .github
          persona: pedantic

      - name: Run zizmor (annotate and fail on findings)
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          inputs: .github
          persona: pedantic
          advanced-security: false
          annotations: true
