  - paragraph: Move between areas with the arrow keys, or type the start of an area's code or name to jump to it. Press Enter to select an area, and Escape to stop comparing. Zoom with plus and minus, and press 0 to see the whole map.
  - button "Zoom in"
  - button "Zoom out" [disabled]
  - button "Show the whole map" [disabled]
  - figure "% of Harrow's link with itself": /% of Harrow's link with itself \d+% or less \d+% or more/
  - complementary:
    - heading "UK Ancestry Map" [level=1]
    - button "Colour theme"
    - group:
      - text: Measure
      - 'button "Help: Measure"'
      - combobox "Measure": number of ancestors
    - group:
      - text: /Time threshold \d+ years/
      - group "Time threshold":
        - slider "Time threshold": /\d+/
      - paragraph: Ancestry calculated this many years in the past.
    - group:
      - text: Postcode area
      - group:
        - combobox "Postcode area": Harrow (HA)
        - group:
          - button "Show all postcode areas"
      - paragraph: Type an area code, such as S or HA, or a place name.
    - group:
      - checkbox "Show advanced"
      - text: Show advanced
    - region "Harrow (HA)":
      - heading "Harrow (HA)" [level=2]
      - paragraph: "/Most related: Llandudno \\(LL\\), at \\d+% of Harrow's link with itself\\./"
      - paragraph: Point at or tap an area on the map, or a bar in the chart, to compare it with the selected area.
      - heading /Top \d+ most related areas/ [level=3]
      - paragraph: As a percentage of Harrow's link with itself.
      - img /Bar chart of the \d+ areas most related to Harrow \(HA\), with error bars/: /0% \d+% \d+% \d+% \d+% LL WD AL SA UB CH HP NW OX RG/
      - list:
        - listitem: "/Llandudno \\(LL\\): \\d+%/"
        - listitem: "/Watford \\(WD\\): \\d+%/"
